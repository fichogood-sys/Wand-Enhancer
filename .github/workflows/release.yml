name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  publish-release:
    if: github.repository == 'fichogood-sys/Wand-Enhancer'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build web-panel (skip failed doc test)
        shell: pwsh
        run: |
          Push-Location web-panel
          pnpm install --frozen-lockfile
          pnpm run build
          Pop-Location

      - name: Build Windows EXE
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Filter *.csproj -Recurse | Select-Object -First 1
          dotnet publish $csproj.FullName -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./output

      - name: Upload EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wand-Enhancer-Windows
          path: ./output/*.exe

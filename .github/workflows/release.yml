name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  publish-release:
    if: github.repository == 'fichogood-sys/Wand-Enhancer'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Build release
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Upload EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wand-Enhancer-Windows
          path: |
            **/*.exe
            !**/node_modules/**

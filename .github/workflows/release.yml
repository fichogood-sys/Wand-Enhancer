name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  publish-release:
    if: github.repository == 'fichogood-sys/Wand-Enhancer'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Build web-panel
        shell: pwsh
        run: |
          pnpm --dir web-panel install --frozen-lockfile
          pnpm --dir web-panel run build

      - name: Fix missing file references in csproj
        shell: pwsh
        run: |
          $csprojPath = "WandEnhancer\WandEnhancer.csproj"
          $content = Get-Content $csprojPath
          $filtered = $content | Where-Object {
            $_ -notmatch "Core\\EnhancerConfig\.cs" -and
            $_ -notmatch "Core\\Patching\\Shared\\ElectronFuseWire\.cs" -and
            $_ -notmatch "Core\\Patching\\Shared\\DiskFusePatch\.cs"
          }
          $filtered | Set-Content $csprojPath -Encoding UTF8

      - name: Build WandEnhancer.exe (MSBuild)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -prerelease -products '*' -requires Microsoft.Component.MSBuild -property installationPath
          $msbuild = Join-Path $vsPath 'MSBuild\Current\Bin\MSBuild.exe'

          & $msbuild Wand-Enhancer.sln /m /t:Restore /p:RestorePackagesConfig=true
          & $msbuild Wand-Enhancer.sln /m /t:Build /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload WandEnhancer.exe
        uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer-Release
          path: WandEnhancer/bin/Release/*
